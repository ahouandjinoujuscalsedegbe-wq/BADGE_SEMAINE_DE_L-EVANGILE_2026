<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Générateur de Badge — Semaine de l'Évangile CUA</title>
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
 <style>
   :root {
     --bg-page: #f1f5f9;
     --bg-card: #ffffff;
     --bg-subtle: #f8fafc;
     --text-main: #0f172a;
     --text-muted: #475569;
     --border-soft: #cbd5e1;
     --navy-pure: #0a1e47;
     --navy-arc: #112c63;
     --orange-accent: #d49a2a;
     --white-pure: #ffffff;
     --share-green: #16a34a;
     --share-hover: #15803d;
     --danger-red: #dc2626;
     --danger-bg: #fef2f2;
     --success-green: #15803d;
     --success-bg: #f0fdf4;
   }

   *,
   *::before,
   *::after {
     box-sizing: border-box;
     margin: 0;
     padding: 0;
   }

   html,
   body {
     width: 100%;
     min-height: 100%;
     background-color: var(--bg-page);
     color: var(--text-main);
     font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
     line-height: 1.5;
     overflow-x: hidden;
     -webkit-tap-highlight-color: transparent;
   }

   .app-shell {
     width: 100%;
     max-width: 1140px;
     margin: 0 auto;
     padding: 18px 14px 40px;
   }

   .app-header {
     text-align: center;
     margin-bottom: 18px;
   }

   .app-header h1 {
     font-size: clamp(1.25rem, 3.6vw, 1.9rem);
     font-weight: 900;
     color: var(--navy-pure);
     letter-spacing: -0.02em;
   }

   .main-grid {
     display: grid;
     grid-template-columns: 1fr;
     gap: 20px;
     align-items: start;
   }

   @media (min-width: 880px) {
     .main-grid {
       grid-template-columns: minmax(320px, 400px) minmax(340px, 1fr);
       gap: 24px;
     }

     .app-shell {
       padding: 26px 20px 48px;
     }
   }

   .panel {
     background: var(--bg-card);
     border: 1px solid var(--border-soft);
     border-radius: 20px;
     padding: 18px;
     box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
   }

   @media (min-width: 600px) {
     .panel {
       padding: 22px;
     }
   }

   .field-block {
     margin-bottom: 16px;
     border-radius: 14px;
     transition: background-color 0.2s ease, box-shadow 0.2s ease;
   }

   .field-block.field-error {
     background-color: var(--danger-bg);
     padding: 10px;
     margin-left: -10px;
     margin-right: -10px;
     box-shadow: 0 0 0 2px var(--danger-red);
     animation: shakeField 0.35s ease;
   }

   @keyframes shakeField {
     0%, 100% { transform: translateX(0); }
     25% { transform: translateX(-5px); }
     75% { transform: translateX(5px); }
   }

   .field-label {
     display: block;
     font-size: 0.9rem;
     font-weight: 700;
     color: var(--text-main);
     margin-bottom: 6px;
   }

   .req-star {
     color: var(--danger-red);
     font-weight: 800;
   }

   .text-input {
     width: 100%;
     padding: 12px 14px;
     font-size: 1rem;
     font-weight: 600;
     font-family: inherit;
     color: var(--text-main);
     background: var(--bg-subtle);
     border: 1.5px solid var(--border-soft);
     border-radius: 12px;
     outline: none;
     transition: border-color 0.2s ease, background-color 0.2s ease;
   }

   .text-input:focus {
     border-color: var(--navy-pure);
     background: var(--white-pure);
     box-shadow: 0 0 0 3px rgba(10, 30, 71, 0.12);
   }

   .text-input.input-invalid {
     border-color: var(--danger-red);
     background: var(--white-pure);
   }

   .upload-dropzone {
     position: relative;
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: center;
     gap: 6px;
     width: 100%;
     min-height: 98px;
     padding: 14px;
     border: 2px dashed #94a3b8;
     border-radius: 14px;
     background: var(--bg-subtle);
     cursor: pointer;
     text-align: center;
     transition: border-color 0.2s ease, background-color 0.2s ease;
   }

   .upload-dropzone:hover,
   .upload-dropzone.dragover {
     border-color: var(--navy-pure);
     background: #eff6ff;
   }

   .upload-dropzone.invalid-zone {
     border-color: var(--danger-red);
     background: var(--white-pure);
   }

   .upload-dropzone input[type="file"] {
     position: absolute;
     inset: 0;
     width: 100%;
     height: 100%;
     opacity: 0;
     cursor: pointer;
   }

   .upload-main-text {
     font-size: 0.92rem;
     font-weight: 700;
     color: var(--navy-pure);
     display: inline-flex;
     align-items: center;
     gap: 8px;
   }

   .photo-status-row {
     margin-top: 8px;
     display: none;
     align-items: center;
     justify-content: space-between;
     gap: 8px;
     font-size: 0.82rem;
     color: var(--success-green);
     font-weight: 600;
   }

   .photo-status-row.visible {
     display: flex;
   }

   .photo-file-name {
     overflow: hidden;
     text-overflow: ellipsis;
     white-space: nowrap;
     max-width: 220px;
   }

   .clear-photo-btn {
     padding: 5px 10px;
     font-size: 0.76rem;
     font-weight: 700;
     font-family: inherit;
     color: var(--danger-red);
     background: var(--danger-bg);
     border: 1px solid #fecaca;
     border-radius: 8px;
     cursor: pointer;
     flex-shrink: 0;
   }

   .clear-photo-btn:hover {
     background: #fee2e2;
   }

   .validation-alert {
     display: none;
     padding: 11px 13px;
     border-radius: 12px;
     font-size: 0.85rem;
     font-weight: 600;
     margin-bottom: 14px;
     background: var(--danger-bg);
     color: #991b1b;
     border: 1px solid #fca5a5;
   }

   .validation-alert.visible {
     display: block;
   }

   .toast-notice {
     display: none;
     padding: 11px 13px;
     border-radius: 12px;
     font-size: 0.84rem;
     font-weight: 600;
     margin-bottom: 14px;
     background: var(--success-bg);
     color: var(--success-green);
     border: 1px solid #86efac;
   }

   .toast-notice.visible {
     display: block;
   }

   .actions-stack {
     display: flex;
     flex-direction: column;
     gap: 10px;
   }

   .btn-action {
     width: 100%;
     padding: 13px 16px;
     font-size: 0.95rem;
     font-weight: 700;
     font-family: inherit;
     border: none;
     border-radius: 13px;
     cursor: pointer;
     display: flex;
     align-items: center;
     justify-content: center;
     gap: 9px;
     transition: transform 0.12s ease, opacity 0.2s ease, background-color 0.2s ease;
   }

   .btn-action:active {
     transform: scale(0.985);
   }

   .btn-action.incomplete {
     opacity: 0.85;
   }

   .btn-share {
     background: var(--share-green);
     color: var(--white-pure);
     box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
   }

   .btn-share:hover {
     background: var(--share-hover);
   }

   .btn-download {
     background: var(--navy-pure);
     color: var(--white-pure);
     box-shadow: 0 4px 12px rgba(10, 30, 71, 0.2);
   }

   .btn-download:hover {
     background: var(--navy-arc);
   }

   .preview-column {
     display: flex;
     flex-direction: column;
     align-items: center;
     width: 100%;
   }

   .canvas-frame-box {
     position: relative;
     width: 100%;
     max-width: 540px;
     aspect-ratio: 1 / 1;
     border-radius: 18px;
     overflow: hidden;
     background: var(--navy-pure);
     box-shadow: 0 14px 34px rgba(10, 30, 71, 0.22);
     border: 2px solid #cbd5e1;
     touch-action: none;
     user-select: none;
     -webkit-user-select: none;
   }

   .canvas-frame-box.can-drag {
     cursor: grab;
   }

   .canvas-frame-box.is-dragging {
     cursor: grabbing;
   }

   #badgeCanvas {
     display: block;
     width: 100%;
     height: 100%;
   }

   .crop-toolbar {
     width: 100%;
     max-width: 540px;
     margin-top: 12px;
     padding: 8px 12px;
     background: var(--bg-card);
     border: 1px solid var(--border-soft);
     border-radius: 14px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     gap: 8px;
     box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
   }

   .crop-toolbar.disabled {
     opacity: 0.5;
     pointer-events: none;
   }

   .zoom-group {
     display: inline-flex;
     align-items: center;
     gap: 6px;
   }

   .crop-btn {
     min-width: 38px;
     height: 36px;
     padding: 0 10px;
     border-radius: 10px;
     border: 1px solid var(--border-soft);
     background: var(--bg-subtle);
     color: var(--navy-pure);
     font-size: 1rem;
     font-weight: 800;
     font-family: inherit;
     cursor: pointer;
     display: inline-flex;
     align-items: center;
     justify-content: center;
     transition: background-color 0.15s ease, border-color 0.15s ease;
   }

   .crop-btn:hover {
     background: #e2e8f0;
     border-color: #94a3b8;
   }

   .crop-btn:active {
     background: #cbd5e1;
   }

   .crop-btn.reset-btn {
     font-size: 0.8rem;
     font-weight: 700;
     padding: 0 12px;
   }

   .zoom-readout {
     min-width: 54px;
     text-align: center;
     font-size: 0.85rem;
     font-weight: 800;
     color: var(--navy-pure);
     font-variant-numeric: tabular-nums;
   }
 </style>
</head>
<body>
 <main class="app-shell">
   <header class="app-header">
     <h1>Générateur de Badge — Semaine de l'Évangile</h1>
   </header>

   <div class="main-grid">
     <!-- Formulaire de personnalisation et actions d'export / partage -->
     <section class="panel" aria-label="Personnalisation du badge">
       <div id="nameBlock" class="field-block">
         <label for="fullNameInput" class="field-label">
           Nom & Prénom <span class="req-star">*</span>
         </label>
         <input
           id="fullNameInput"
           type="text"
           class="text-input"
           placeholder="Ex. : Jean-Marc KOUASSI"
           maxlength="44"
           autocomplete="name"
         />
       </div>

       <div id="photoBlock" class="field-block">
         <label for="photoFileInput" class="field-label">
           Photo <span class="req-star">*</span>
         </label>
         <div id="dropzone" class="upload-dropzone">
           <input
             id="photoFileInput"
             type="file"
             accept="image/*"
           />
           <span class="upload-main-text">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
               <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
               <circle cx="8.5" cy="8.5" r="1.5"></circle>
               <polyline points="21 15 16 10 5 21"></polyline>
             </svg>
             <span>Choisir une photo</span>
           </span>
         </div>
         <div id="photoStatusRow" class="photo-status-row">
           <span id="photoFileName" class="photo-file-name">Photo chargée</span>
           <button type="button" id="clearPhotoBtn" class="clear-photo-btn">Retirer</button>
         </div>
       </div>

       <div id="validationAlert" class="validation-alert" role="alert" aria-live="assertive"></div>
       <div id="toastNotice" class="toast-notice" role="status" aria-live="polite"></div>

       <div class="actions-stack">
         <button type="button" id="shareAppBtn" class="btn-action btn-share incomplete">
           <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
             <circle cx="18" cy="5" r="3"></circle>
             <circle cx="6" cy="12" r="3"></circle>
             <circle cx="18" cy="19" r="3"></circle>
             <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
             <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
           </svg>
           <span>Partager (WhatsApp, Facebook...)</span>
         </button>

         <button type="button" id="downloadPngBtn" class="btn-action btn-download incomplete">
           <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
             <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
             <polyline points="7 10 12 15 17 10"></polyline>
             <line x1="12" y1="15" x2="12" y2="3"></line>
           </svg>
           <span>Télécharger le badge PNG</span>
         </button>
       </div>
     </section>

     <!-- Aperçu interactif haute résolution et commandes de recadrage -->
     <section class="preview-column" aria-label="Aperçu du badge">
       <div id="canvasFrameBox" class="canvas-frame-box">
         <!-- Tampon interne 2x (2160 x 2160 px) mappé sur 0..1080 en coordonnées logiques -->
         <canvas id="badgeCanvas" width="2160" height="2160"></canvas>
       </div>

       <div id="cropToolbar" class="crop-toolbar disabled" aria-label="Outils de recadrage photo">
         <div class="zoom-group">
           <button type="button" id="zoomOutBtn" class="crop-btn" title="Dézoomer" aria-label="Dézoomer">−</button>
           <span id="zoomReadout" class="zoom-readout">100%</span>
           <button type="button" id="zoomInBtn" class="crop-btn" title="Zoomer" aria-label="Zoomer">+</button>
         </div>
         <button type="button" id="resetCropBtn" class="crop-btn reset-btn">Recentrer</button>
       </div>
     </section>
   </div>
 </main>

 <script>
   (function () {
     'use strict';

     // Dimensions logiques 1080x1080 rendues sur tampon 2x (2160x2160)
     const LOGICAL_SIZE = 1080;
     const SUPERSAMPLE = 2;
     const INTERNAL_SIZE = LOGICAL_SIZE * SUPERSAMPLE;

     // Palette officielle : fond bleu nuit #0A1E47 et orange doré #D49A2A
     const NAVY_PURE = '#0A1E47';
     const NAVY_RADIAL = '#16377A';
     const ORANGE_GOLD = '#D49A2A';
     const WHITE_PURE = '#FFFFFF';

     // Cadre photo carré arrondi au centre-gauche (450 x 450 px)
     const PHOTO_BOX = Object.freeze({
       x: 52,
       y: 282,
       size: 450,
       radius: 28
     });

     const ZOOM_MIN = 0.5;
     const ZOOM_MAX = 3.5;
     const ZOOM_STEP = 0.12;

     // Textes officiels exacts de l'événement
     const COPY = Object.freeze({
       logoCode: 'CUA',
       logoFull: 'Centre Universitaire Apostolique',
       pill: "SEMAINE DE L'ÉVANGILE",
       headline: "J'Y SERAI !",
       subline1: 'POUR PRÊCHER ET GAGNER',
       subline2: 'DES ÂMES À CHRIST',
       dateText: 'Du Lundi 30 Novembre au Samedi 05 Décembre 2026',
       placeText: "Université d'Abomey-Calavi",
       timeText: 'Départ 16h45 • Ensemble pour Christ',
       placeholderName: 'VOTRE NOM & PRÉNOM',
       verseText: '« Allez par tout le monde, et prêchez la bonne nouvelle à toute la création. » — Marc 16:15',
       footerText: 'GAGNER DES ÂMES • ENSEMBLE POUR CHRIST'
     });

     const canvas = document.getElementById('badgeCanvas');
     const canvasFrameBox = document.getElementById('canvasFrameBox');
     const fullNameInput = document.getElementById('fullNameInput');
     const nameBlock = document.getElementById('nameBlock');
     const photoFileInput = document.getElementById('photoFileInput');
     const photoBlock = document.getElementById('photoBlock');
     const dropzone = document.getElementById('dropzone');
     const photoStatusRow = document.getElementById('photoStatusRow');
     const photoFileName = document.getElementById('photoFileName');
     const clearPhotoBtn = document.getElementById('clearPhotoBtn');
     const validationAlert = document.getElementById('validationAlert');
     const toastNotice = document.getElementById('toastNotice');
     const shareAppBtn = document.getElementById('shareAppBtn');
     const downloadPngBtn = document.getElementById('downloadPngBtn');
     const cropToolbar = document.getElementById('cropToolbar');
     const zoomOutBtn = document.getElementById('zoomOutBtn');
     const zoomInBtn = document.getElementById('zoomInBtn');
     const zoomReadout = document.getElementById('zoomReadout');
     const resetCropBtn = document.getElementById('resetCropBtn');

     const state = {
       fullName: '',
       photoImg: null,
       photoLoaded: false,
       zoom: 1,
       offsetX: 0,
       offsetY: 0,
       dragging: false,
       dragStartX: 0,
       dragStartY: 0,
       pinchStartDist: 0,
       pinchStartZoom: 1,
       holdTimer: null,
       holdInterval: null,
       attemptedSubmit: false
     };

     // Helper universel de rectangle arrondi compatible avec tous les navigateurs
     function drawRoundedRect(ctx, x, y, w, h, r) {
       const radius = Math.max(0, Math.min(r, Math.min(w, h) / 2));
       ctx.beginPath();
       ctx.moveTo(x + radius, y);
       ctx.arcTo(x + w, y, x + w, y + h, radius);
       ctx.arcTo(x + w, y + h, x, y + h, radius);
       ctx.arcTo(x, y + h, x, y, radius);
       ctx.arcTo(x, y, x + w, y, radius);
       ctx.closePath();
     }

     // Exécution protégée d'une étape de dessin avec fonction de secours
     function safeDrawStep(fn, fallbackFn) {
       try {
         fn();
       } catch (err) {
         if (typeof console !== 'undefined' && console.warn) {
           console.warn('Étape de rendu interceptée :', err);
         }
         if (typeof fallbackFn === 'function') {
           try {
             fallbackFn();
           } catch (_) {}
         }
       }
     }

     function clamp(value, min, max) {
       return Math.max(min, Math.min(max, value));
     }

     function getCleanName() {
       return (state.fullName || '').trim().replace(/\s+/g, ' ');
     }

     function isNameValid() {
       return getCleanName().length >= 2;
     }

     function isPhotoValid() {
       return Boolean(state.photoLoaded && state.photoImg && state.photoImg.width > 0);
     }

     function showToast(message) {
       if (!toastNotice) return;
       toastNotice.textContent = message;
       toastNotice.classList.add('visible');
       setTimeout(function () {
         if (toastNotice.textContent === message) {
           toastNotice.classList.remove('visible');
         }
       }, 4200);
     }

     // Synchronise l'état visuel du formulaire, des boutons et de la barre de recadrage
     function syncUiState() {
       const nameOk = isNameValid();
       const photoOk = isPhotoValid();
       const allOk = nameOk && photoOk;

       if (shareAppBtn) shareAppBtn.classList.toggle('incomplete', !allOk);
       if (downloadPngBtn) downloadPngBtn.classList.toggle('incomplete', !allOk);

       if (cropToolbar) cropToolbar.classList.toggle('disabled', !photoOk);
       if (canvasFrameBox) canvasFrameBox.classList.toggle('can-drag', photoOk);
       if (zoomReadout) zoomReadout.textContent = Math.round(state.zoom * 100) + '%';

       if (state.attemptedSubmit) {
         if (nameBlock) nameBlock.classList.toggle('field-error', !nameOk);
         if (fullNameInput) fullNameInput.classList.toggle('input-invalid', !nameOk);
         if (photoBlock) photoBlock.classList.toggle('field-error', !photoOk);
         if (dropzone) dropzone.classList.toggle('invalid-zone', !photoOk);

         if (allOk && validationAlert) {
           validationAlert.classList.remove('visible');
           validationAlert.textContent = '';
         }
       } else {
         if (nameBlock) nameBlock.classList.remove('field-error');
         if (fullNameInput) fullNameInput.classList.remove('input-invalid');
         if (photoBlock) photoBlock.classList.remove('field-error');
         if (dropzone) dropzone.classList.remove('invalid-zone');
       }
     }

     // Valide les champs obligatoires avant téléchargement ou partage
     function validateAndHighlight() {
       state.attemptedSubmit = true;
       const nameOk = isNameValid();
       const photoOk = isPhotoValid();
       syncUiState();

       if (!nameOk && !photoOk) {
         if (validationAlert) {
           validationAlert.textContent = 'Veuillez saisir votre Nom & Prénom (2 caractères min.) et choisir une photo.';
           validationAlert.classList.add('visible');
         }
         if (fullNameInput) fullNameInput.focus();
         return false;
       }

       if (!nameOk) {
         if (validationAlert) {
           validationAlert.textContent = 'Veuillez saisir votre Nom & Prénom (au moins 2 caractères).';
           validationAlert.classList.add('visible');
         }
         if (fullNameInput) fullNameInput.focus();
         return false;
       }

       if (!photoOk) {
         if (validationAlert) {
           validationAlert.textContent = 'Veuillez importer votre photo avant de partager ou télécharger.';
           validationAlert.classList.add('visible');
         }
         if (photoFileInput) photoFileInput.focus();
         return false;
       }

       if (validationAlert) {
         validationAlert.classList.remove('visible');
         validationAlert.textContent = '';
       }
       return true;
     }

     // Fond bleu nuit #0A1E47 avec dégradé radial, anneaux discrets, courbes dorées subtiles et bordure dorée
     function drawBackground(ctx) {
       ctx.save();
       ctx.fillStyle = NAVY_PURE;
       ctx.fillRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

       const radGrad = ctx.createRadialGradient(
         LOGICAL_SIZE * 0.5,
         LOGICAL_SIZE * 0.44,
         40,
         LOGICAL_SIZE * 0.5,
         LOGICAL_SIZE * 0.48,
         LOGICAL_SIZE * 0.72
       );
       radGrad.addColorStop(0, NAVY_RADIAL);
       radGrad.addColorStop(0.58, NAVY_PURE);
       radGrad.addColorStop(1, '#06132E');
       ctx.fillStyle = radGrad;
       ctx.fillRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);

       ctx.strokeStyle = 'rgba(255, 255, 255, 0.045)';
       ctx.lineWidth = 2;
       const rings = [220, 350, 480, 610];
       for (let i = 0; i < rings.length; i += 1) {
         ctx.beginPath();
         ctx.arc(LOGICAL_SIZE / 2, 500, rings[i], 0, Math.PI * 2);
         ctx.stroke();
       }

       ctx.strokeStyle = 'rgba(212, 154, 42, 0.14)';
       ctx.lineWidth = 2;
       ctx.beginPath();
       ctx.moveTo(-25, 168);
       ctx.bezierCurveTo(240, 108, 295, 412, 540, 452);
       ctx.stroke();

       ctx.beginPath();
       ctx.moveTo(LOGICAL_SIZE + 25, 232);
       ctx.bezierCurveTo(820, 202, 790, 522, 540, 572);
       ctx.stroke();

     // Double soulignement ondulé décoratif avec losanges sous "J'Y SERAI !"
     function drawDoubleWaveUnderline(ctx, centerX, startY, width, color) {
       ctx.save();
       const halfW = width * 0.48;
       const leftX = centerX - halfW;
       const rightX = centerX + halfW;
       const segments = 6;
       const stepW = (rightX - leftX) / segments;

       ctx.strokeStyle = color;
       ctx.lineWidth = 3.6;
       ctx.lineCap = 'round';
       ctx.lineJoin = 'round';
       ctx.beginPath();
       ctx.moveTo(leftX, startY);
       for (let i = 0; i < segments; i += 1) {
         const x0 = leftX + i * stepW;
         const xMid = x0 + stepW * 0.5;
         const x1 = x0 + stepW;
         const amp = (i % 2 === 0 ? -1 : 1) * 5.5;
         ctx.quadraticCurveTo(xMid, startY + amp, x1, startY);
       }
       ctx.stroke();

       ctx.lineWidth = 1.9;
       ctx.globalAlpha = 0.9;
       ctx.beginPath();
       const innerLeft = leftX + 14;
       const innerRight = rightX - 14;
       const innerSegs = segments - 1;
       const innerStep = (innerRight - innerLeft) / innerSegs;
       ctx.moveTo(innerLeft, startY + 8);
       for (let i = 0; i < innerSegs; i += 1) {
         const x0 = innerLeft + i * innerStep;
         const xMid = x0 + innerStep * 0.5;
         const x1 = x0 + innerStep;
         const amp = (i % 2 === 0 ? 1 : -1) * 3.8;
         ctx.quadraticCurveTo(xMid, startY + 8 + amp, x1, startY + 8);
       }
       ctx.stroke();

       ctx.globalAlpha = 1;
       ctx.fillStyle = color;
       const drawDiamond = function (dx, dy) {
         ctx.beginPath();
         ctx.moveTo(dx, dy - 4.4);
         ctx.lineTo(dx + 4.4, dy);
         ctx.lineTo(dx, dy + 4.4);
         ctx.lineTo(dx - 4.4, dy);
         ctx.closePath();
         ctx.fill();
       };
       drawDiamond(leftX - 10, startY);
       drawDiamond(rightX + 10, startY);
       ctx.restore();
     }

     function drawCalendarIcon(ctx, cx, cy, size, color) {

       drawRoundedRect(ctx, x, y + 2, w, h - 2, 4);
       ctx.stroke();

       ctx.beginPath();
       ctx.moveTo(x + 1, y + 9.5);

       ctx.stroke();

       ctx.beginPath();
       ctx.moveTo(x + w * 0.3, y);

       ctx.moveTo(x + w * 0.7, y);
       ctx.lineTo(x + w * 0.7, y + 4.8);

     }

     function drawPinIcon(ctx, cx, cy, size, color) {
       ctx.save();
       ctx.strokeStyle = color;
       ctx.fillStyle = color;
       ctx.lineWidth = 2.4;
       ctx.lineCap = 'round';
       ctx.lineJoin = 'round';

       const r = size * 0.35;
       const headY = cy - size * 0.14;
       const tipY = cy + size * 0.48;

       ctx.beginPath();
       ctx.arc(cx, headY, r, Math.PI * 0.85, Math.PI * 2.15, false);
       ctx.lineTo(cx, tipY);
       ctx.closePath();
       ctx.stroke();

       ctx.beginPath();
       ctx.arc(cx, headY, r * 0.38, 0, Math.PI * 2);
       ctx.fill();
       ctx.restore();
     }

     function drawClockIcon(ctx, cx, cy, size, color) {
       ctx.save();
       ctx.strokeStyle = color;
       ctx.fillStyle = color;
       ctx.lineWidth = 2.4;
       ctx.lineCap = 'round';
       ctx.lineJoin = 'round';

       const r = size * 0.44;
       ctx.beginPath();
       ctx.arc(cx, cy, r, 0, Math.PI * 2);
       ctx.stroke();

       ctx.beginPath();
       ctx.moveTo(cx, cy);
       ctx.lineTo(cx, cy - r * 0.56);
       ctx.moveTo(cx, cy);
       ctx.lineTo(cx + r * 0.46, cy + r * 0.16);
       ctx.stroke();

       ctx.beginPath();
       ctx.arc(cx, cy, 2.1, 0, Math.PI * 2);
       ctx.fill();
       ctx.restore();
     }

     // Rendu complet sur le canvas 2160x2160 mappé en coordonnées logiques 1080x1080
     function renderBadge() {
       if (!canvas) return;
       let ctx = null;
       try {
         ctx = canvas.getContext('2d');
       } catch (_) {
         ctx = null;
       }
       if (!ctx) return;

       try {
         if (canvas.width !== INTERNAL_SIZE) canvas.width = INTERNAL_SIZE;
         if (canvas.height !== INTERNAL_SIZE) canvas.height = INTERNAL_SIZE;
       } catch (_) {}

       try {
         ctx.setTransform(SUPERSAMPLE, 0, 0, SUPERSAMPLE, 0, 0);
       } catch (_) {
         try {
           ctx.resetTransform();
           ctx.scale(SUPERSAMPLE, SUPERSAMPLE);
         } catch (__) {}
       }

       try {
         ctx.imageSmoothingEnabled = true;
         ctx.imageSmoothingQuality = 'high';
       } catch (_) {}

       safeDrawStep(
         function () { drawBackground(ctx); },
         function () {
           ctx.fillStyle = NAVY_PURE;
           ctx.fillRect(0, 0, LOGICAL_SIZE, LOGICAL_SIZE);
         }
       );
       safeDrawStep(function () { drawCuaPlaque(ctx); });
       safeDrawStep(function () { drawEventPill(ctx); });
       safeDrawStep(function () { drawPhotoFrame(ctx); });
       safeDrawStep(function () { drawRightColumn(ctx); });
       safeDrawStep(function () { drawLowerSection(ctx); });
     }

     function handlePhotoFile(file) {
       if (!file) return;
       if (file.type && !file.type.startsWith('image/')) {
         if (validationAlert) {
           validationAlert.textContent = 'Veuillez choisir un fichier image valide (JPG, PNG, WEBP).';
           validationAlert.classList.add('visible');
         }
         return;
       }

       const applyLoadedImage = function (img) {
         state.photoImg = img;
         state.photoLoaded = true;
         state.zoom = 1;
         state.offsetX = 0;
         state.offsetY = 0;

         if (photoFileName) photoFileName.textContent = file.name || 'Photo importée';
         if (photoStatusRow) photoStatusRow.classList.add('visible');
         syncUiState();
         renderBadge();
       };

       try {
         const reader = new FileReader();
         reader.onload = function (evt) {
           const img = new Image();
           img.onload = function () {
             applyLoadedImage(img);
           };
           img.onerror = function () {
             if (validationAlert) {
               validationAlert.textContent = 'Impossible de lire cette image.';
               validationAlert.classList.add('visible');
             }
           };
           img.src = String(evt && evt.target && evt.target.result ? evt.target.result : '');
         };
         reader.onerror = function () {
           if (validationAlert) {
             validationAlert.textContent = 'Erreur lors de la lecture de la photo.';
             validationAlert.classList.add('visible');
           }
         };
         reader.readAsDataURL(file);
       } catch (_) {
         try {
           const url = URL.createObjectURL(file);
           const img = new Image();
           img.onload = function () {
             applyLoadedImage(img);
             setTimeout(function () {
               try { URL.revokeObjectURL(url); } catch (__) {}
             }, 2000);
           };
           img.src = url;
         } catch (__) {}
       }
     }

     function clearPhoto() {
       state.photoImg = null;
       state.photoLoaded = false;
       state.zoom = 1;
       state.offsetX = 0;
       state.offsetY = 0;
       if (photoFileInput) photoFileInput.value = '';
       if (photoStatusRow) photoStatusRow.classList.remove('visible');
       syncUiState();
       renderBadge();
     }

     function setZoom(nextZoom) {
       if (!isPhotoValid()) return;
       state.zoom = clamp(Number(nextZoom.toFixed(2)), ZOOM_MIN, ZOOM_MAX);
       if (zoomReadout) zoomReadout.textContent = Math.round(state.zoom * 100) + '%';
       renderBadge();
     }

     function resetCrop() {
       if (!isPhotoValid()) return;
       state.zoom = 1;
       state.offsetX = 0;
       state.offsetY = 0;
       if (zoomReadout) zoomReadout.textContent = '100%';
       renderBadge();
     }

     function clientToBadgeCoords(clientX, clientY) {
       if (!canvasFrameBox) return { x: 0, y: 0 };
       const rect = canvasFrameBox.getBoundingClientRect();
       if (!rect.width || !rect.height) return { x: 0, y: 0 };
       return {
         x: ((clientX - rect.left) / rect.width) * LOGICAL_SIZE,
         y: ((clientY - rect.top) / rect.height) * LOGICAL_SIZE
       };
     }

     function isInsidePhotoBox(bx, by) {
       return (
         bx >= PHOTO_BOX.x &&
         bx <= PHOTO_BOX.x + PHOTO_BOX.size &&
         by >= PHOTO_BOX.y &&
         by <= PHOTO_BOX.y + PHOTO_BOX.size
       );
     }

     function getTouchDistance(t1, t2) {
       return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
     }

     // Interactions souris et tactiles pour déplacer, zoomer et pincer la photo dans le cadre
     if (canvasFrameBox) {
       canvasFrameBox.addEventListener('mousedown', function (e) {
         if (!isPhotoValid() || e.button !== 0) return;
         const pt = clientToBadgeCoords(e.clientX, e.clientY);
         if (!isInsidePhotoBox(pt.x, pt.y)) return;

         state.dragging = true;
         state.dragStartX = pt.x - state.offsetX;
         state.dragStartY = pt.y - state.offsetY;
         canvasFrameBox.classList.add('is-dragging');
       });

       window.addEventListener('mousemove', function (e) {
         if (!state.dragging || !isPhotoValid()) return;
         const pt = clientToBadgeCoords(e.clientX, e.clientY);
         state.offsetX = clamp(pt.x - state.dragStartX, -550, 550);
         state.offsetY = clamp(pt.y - state.dragStartY, -550, 550);
         renderBadge();
       });

       window.addEventListener('mouseup', function () {
         if (state.dragging) {
           state.dragging = false;
           canvasFrameBox.classList.remove('is-dragging');
         }
       });

       canvasFrameBox.addEventListener('wheel', function (e) {
         if (!isPhotoValid()) return;
         const pt = clientToBadgeCoords(e.clientX, e.clientY);
         if (!isInsidePhotoBox(pt.x, pt.y)) return;
         e.preventDefault();
         setZoom(state.zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
       }, { passive: false });

       canvasFrameBox.addEventListener('touchstart', function (e) {
         if (!isPhotoValid()) return;

         if (e.touches.length === 2) {
           state.dragging = false;
           state.pinchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
           state.pinchStartZoom = state.zoom;
           e.preventDefault();
           return;
         }

         if (e.touches.length === 1) {
           const t = e.touches[0];
           const pt = clientToBadgeCoords(t.clientX, t.clientY);
           if (!isInsidePhotoBox(pt.x, pt.y)) return;
           state.dragging = true;
           state.dragStartX = pt.x - state.offsetX;
           state.dragStartY = pt.y - state.offsetY;
           canvasFrameBox.classList.add('is-dragging');
           e.preventDefault();
         }
       }, { passive: false });

       canvasFrameBox.addEventListener('touchmove', function (e) {
         if (!isPhotoValid()) return;

         if (e.touches.length === 2 && state.pinchStartDist > 0) {
           const dist = getTouchDistance(e.touches[0], e.touches[1]);
           setZoom(state.pinchStartZoom * (dist / state.pinchStartDist));
           e.preventDefault();
           return;
         }

         if (e.touches.length === 1 && state.dragging) {
           const t = e.touches[0];
           const pt = clientToBadgeCoords(t.clientX, t.clientY);
           state.offsetX = clamp(pt.x - state.dragStartX, -550, 550);
           state.offsetY = clamp(pt.y - state.dragStartY, -550, 550);
           renderBadge();
           e.preventDefault();
         }
       }, { passive: false });

       canvasFrameBox.addEventListener('touchend', function (e) {
         if (e.touches.length < 2) state.pinchStartDist = 0;
         if (e.touches.length === 0) {
           state.dragging = false;
           canvasFrameBox.classList.remove('is-dragging');
         }
       });
     }

     function bindHoldZoom(btn, delta) {
       if (!btn) return;
       const stopHold = function () {
         if (state.holdTimer) {
           clearTimeout(state.holdTimer);
           state.holdTimer = null;
         }
         if (state.holdInterval) {
           clearInterval(state.holdInterval);
           state.holdInterval = null;
         }
       };

       btn.addEventListener('click', function () {
         setZoom(state.zoom + delta);
       });

       btn.addEventListener('mousedown', function () {
         stopHold();
         state.holdTimer = setTimeout(function () {
           state.holdInterval = setInterval(function () {
             setZoom(state.zoom + delta * 0.5);
           }, 80);
         }, 260);
       });

       btn.addEventListener('touchstart', function () {
         stopHold();
         state.holdTimer = setTimeout(function () {
           state.holdInterval = setInterval(function () {
             setZoom(state.zoom + delta * 0.5);
           }, 80);
         }, 260);
       }, { passive: true });

       ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(function (ev) {
         btn.addEventListener(ev, stopHold);
       });
     }

     bindHoldZoom(zoomOutBtn, -ZOOM_STEP);
     bindHoldZoom(zoomInBtn, ZOOM_STEP);
     if (resetCropBtn) resetCropBtn.addEventListener('click', resetCrop);

     // Export PNG 1080 x 1080 px depuis le tampon interne 2160 x 2160 px
     function buildExport1080Canvas() {
       renderBadge();
       const exportCanvas = document.createElement('canvas');
       exportCanvas.width = LOGICAL_SIZE;
       exportCanvas.height = LOGICAL_SIZE;
       const eCtx = exportCanvas.getContext('2d');
       if (!eCtx) {
         throw new Error('Contexte export indisponible');
       }
       eCtx.imageSmoothingEnabled = true;
       eCtx.imageSmoothingQuality = 'high';
       eCtx.drawImage(canvas, 0, 0, LOGICAL_SIZE, LOGICAL_SIZE);
       return exportCanvas;
     }

     function canvasToPngBlob(sourceCanvas) {
       return new Promise(function (resolve, reject) {
         try {
           sourceCanvas.toBlob(function (blob) {
             if (blob) {
               resolve(blob);
               return;
             }
             try {
               const dataUrl = sourceCanvas.toDataURL('image/png');
               const parts = dataUrl.split(',');
               const byteString = atob(parts[1]);
               const ab = new ArrayBuffer(byteString.length);
               const ia = new Uint8Array(ab);
               for (let i = 0; i < byteString.length; i += 1) {
                 ia[i] = byteString.charCodeAt(i);
               }
               resolve(new Blob([ab], { type: 'image/png' }));
             } catch (fallbackErr) {
               reject(fallbackErr);
             }
           }, 'image/png', 1);
         } catch (err) {
           reject(err);
         }
       });
     }

     function exportBadge1080Blob() {
       return new Promise(function (resolve, reject) {
         try {
           const exportCanvas = buildExport1080Canvas();
           canvasToPngBlob(exportCanvas).then(resolve).catch(reject);
         } catch (err) {
           reject(err);
         }
       });
     }

     function saveBlobAsFile(blob, filename) {
       const url = URL.createObjectURL(blob);
       const link = document.createElement('a');
       link.href = url;
       link.download = filename;
       document.body.appendChild(link);
       link.click();
       document.body.removeChild(link);
       setTimeout(function () {
         try { URL.revokeObjectURL(url); } catch (_) {}
       }, 3000);
     }

     async function handleDownloadPng() {
       if (!validateAndHighlight()) return;
       try {
         const blob = await exportBadge1080Blob();
         saveBlobAsFile(blob, 'badge-semaine-evangile-cua.png');
         showToast('Badge PNG 1080×1080 px téléchargé avec succès.');
       } catch (_) {
         if (validationAlert) {
           validationAlert.textContent = 'Impossible de télécharger le badge pour le moment.';
           validationAlert.classList.add('visible');
         }
       }
     }

     // Télécharge automatiquement le PNG puis ouvre directement le tiroir de partage natif avec l'image PNG
     async function handleSystemShare() {
       if (!validateAndHighlight()) return;

       const fileName = 'badge-semaine-evangile-cua.png';

       let pngBlob = null;
       try {
         pngBlob = await exportBadge1080Blob();
       } catch (_) {
         pngBlob = null;
       }

       if (!pngBlob) {
         if (validationAlert) {
           validationAlert.textContent = 'Impossible de préparer l’image PNG du badge.';
           validationAlert.classList.add('visible');
         }
         return;
       }

       // Téléchargement automatique du fichier PNG sur l'appareil
       saveBlobAsFile(pngBlob, fileName);

       const pngFile = new File([pngBlob], fileName, { type: 'image/png' });
       const hasNativeShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function';
       let canShareImage = false;

       if (hasNativeShare) {
         if (typeof navigator.canShare === 'function') {
           try {
             canShareImage = Boolean(navigator.canShare({ files: [pngFile] }));
           } catch (_) {
             canShareImage = false;
           }
         } else {
           canShareImage = true;
         }
       }

       if (canShareImage) {
         try {
           await navigator.share({
             files: [pngFile]
           });
           showToast('Badge PNG téléchargé et partagé.');
           return;
         } catch (err) {
           if (err && err.name === 'AbortError') {
             showToast('Badge PNG téléchargé sur votre appareil.');
             return;
           }
         }
       }

       showToast('Badge PNG téléchargé ! Sélectionnez badge-semaine-evangile-cua.png dans WhatsApp ou Facebook.');
     }

     if (fullNameInput) {
       fullNameInput.addEventListener('input', function () {
         state.fullName = fullNameInput.value;
         syncUiState();
         renderBadge();
       });
     }

     if (photoFileInput) {
       photoFileInput.addEventListener('change', function () {
         const f = photoFileInput.files && photoFileInput.files[0];
         if (f) handlePhotoFile(f);
       });
     }

     if (dropzone) {
       dropzone.addEventListener('dragover', function (e) {
         e.preventDefault();
         dropzone.classList.add('dragover');
       });
       dropzone.addEventListener('dragleave', function () {
         dropzone.classList.remove('dragover');
       });
       dropzone.addEventListener('drop', function (e) {
         e.preventDefault();
         dropzone.classList.remove('dragover');
         const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
         if (f) handlePhotoFile(f);
       });
     }

     if (clearPhotoBtn) clearPhotoBtn.addEventListener('click', clearPhoto);
     if (shareAppBtn) shareAppBtn.addEventListener('click', handleSystemShare);
     if (downloadPngBtn) downloadPngBtn.addEventListener('click', handleDownloadPng);

     function renderAll() {
       syncUiState();
       renderBadge();
     }

     renderAll();

     if (typeof requestAnimationFrame === 'function') {
       requestAnimationFrame(renderAll);
     }

     if (document.readyState === 'loading') {
       document.addEventListener('DOMContentLoaded', renderAll, { once: true });
     }

     window.addEventListener('load', renderAll);
     window.addEventListener('resize', renderAll);
     window.addEventListener('orientationchange', function () {
       renderAll();
       setTimeout(renderAll, 150);
     });

     if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
       document.fonts.ready.then(renderAll).catch(function () {});
     }

     if (typeof ResizeObserver === 'function' && canvasFrameBox) {
       try {
         const observer = new ResizeObserver(function () {
           renderBadge();
         });
         observer.observe(canvasFrameBox);
       } catch (_) {}
     }

     setTimeout(renderAll, 120);
   })();
 </script>
